<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Archive</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg: #201510;
    --bg-2: #29190f;
    --shelf: #4a3222;
    --shelf-light: #5e4530;
    --shelf-dark: #33200f;
    --parchment: #efe3c8;
    --brass: #c9a227;
    --brass-dim: #8a7220;
    --ink: #1c130d;
    /* Book spine color palette, cycled by position on the shelf. */
    --spine-1: #2f4f3e;
    --spine-2: #6b2737;
    --spine-3: #1f3a5f;
    --spine-4: #a67c1e;
    --spine-5: #4b3f72;
    --spine-6: #3e5c42;
    --spine-7: #7a3b2e;
    --spine-8: #244b5a;
    --spine-9: #5c3d5c;
    --spine-10: #6e5a1f;
    --spine-11: #2e4a3a;
    --spine-12: #5a2f3e;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:
      radial-gradient(ellipse at 50% 0%, #2e1e14 0%, var(--bg) 55%, var(--bg-2) 100%);
    color: var(--parchment);
    font-family: 'Source Sans 3', sans-serif;
    min-height:100vh;
    padding: 48px 24px 96px;
  }

  .library{
    max-width: 980px;
    margin: 0 auto;
  }

  .intro{
    text-align:center;
    margin-bottom: 56px;
    animation: fadeDown .8s ease both;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    letter-spacing: .18em;
    font-size: 12px;
    color: var(--brass);
    margin: 0 0 14px;
    text-transform: uppercase;
  }
  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(40px, 7vw, 68px);
    margin: 0 0 14px;
    color: var(--parchment);
    letter-spacing: -.01em;
  }
  .subtitle{
    font-size: 16px;
    color: #cbbfa2;
    margin: 0;
    max-width: 440px;
    margin-inline: auto;
  }

  .shelf-block{
    margin-bottom: 46px;
    opacity: 0;
    animation: fadeUp .7s ease forwards;
  }

  .year-plate{
    display:flex;
    align-items:center;
    gap: 14px;
    margin-bottom: 14px;
    padding-left: 6px;
  }
  .year-plate .brass-tab{
    font-family:'Fraunces', serif;
    font-weight: 700;
    font-size: 22px;
    background: linear-gradient(180deg, #e2c15a, var(--brass) 60%, var(--brass-dim));
    color: #241a0a;
    padding: 6px 18px;
    border-radius: 3px;
    box-shadow: 0 2px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.35);
    letter-spacing: .02em;
  }
  .year-plate .year-note{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: #8a7a5f;
  }

  .books-row{
    display:flex;
    align-items:flex-end;
    gap: 3px;
    padding: 14px 14px 0;
    overflow-x: auto;
    overflow-y: visible;
    scrollbar-width: thin;
  }
  .books-row::-webkit-scrollbar{ height: 6px; }
  .books-row::-webkit-scrollbar-thumb{ background: var(--shelf-light); border-radius: 4px;}

  .book{
    position:relative;
    flex: 0 0 auto;
    height: 168px;
    width: 40px;
    border-radius: 3px 6px 6px 3px;
    cursor:pointer;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom: 10px;
    box-shadow: inset -3px 0 6px rgba(0,0,0,.35), inset 2px 0 0 rgba(255,255,255,.06), 0 4px 6px rgba(0,0,0,.35);
    transition: transform .25s ease, box-shadow .25s ease, height .25s ease;
    transform-origin: bottom;
  }
  .book:hover, .book:focus-visible{
    transform: translateY(-14px) rotate(-1.5deg);
    box-shadow: inset -3px 0 6px rgba(0,0,0,.35), inset 2px 0 0 rgba(255,255,255,.08), 0 18px 20px rgba(0,0,0,.45);
    outline: none;
  }
  .book:hover .spine-label, .book:focus-visible .spine-label{ color: var(--parchment); }

  .book .spine-label{
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .08em;
    color: rgba(239,227,200,.75);
    transform: rotate(180deg);
    white-space: nowrap;
    pointer-events:none;
  }
  .book .spine-cap{
    position:absolute;
    top: 8px;
    left: 6px;
    right: 6px;
    height: 3px;
    background: rgba(255,255,255,.18);
    border-radius: 2px;
  }
  .book .count-dot{
    position:absolute;
    bottom: 8px;
    right: -1px;
    left: -1px;
    display:none;
  }

  .shelf-board{
    height: 22px;
    margin-top: -2px;
    background:
      repeating-linear-gradient(90deg, var(--shelf) 0px, var(--shelf-light) 2px, var(--shelf) 4px),
      linear-gradient(180deg, var(--shelf-light), var(--shelf) 40%, var(--shelf-dark));
    border-radius: 2px;
    box-shadow: 0 8px 14px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.08);
  }

  /* Lightbox */
  .lightbox{
    position: fixed; inset:0;
    background: rgba(10,7,4,.82);
    backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center;
    z-index: 100;
    opacity:0; pointer-events:none;
    transition: opacity .25s ease;
    padding: 20px;
  }
  .lightbox.open{ opacity:1; pointer-events:auto; }

  .lightbox-card{
    position:relative;
    background: linear-gradient(180deg, #2a1d13, #201510);
    border: 1px solid rgba(201,162,39,.25);
    border-radius: 12px;
    width: min(1200px, 96vw);
    max-height: 94vh;
    padding: 22px 22px 18px;
    box-shadow: 0 30px 70px rgba(0,0,0,.6);
    transform: scale(.94) translateY(10px);
    transition: transform .25s ease;
    display:flex;
    flex-direction:column;
  }
  .lightbox.open .lightbox-card{ transform: scale(1) translateY(0); }

  .close-btn{
    position:absolute; top:12px; right:12px;
    background:none; border:none; color:#cbbfa2;
    font-size:18px; cursor:pointer; line-height:1;
    width:30px;height:30px; border-radius:50%;
    transition: background .2s ease, color .2s ease;
  }
  .close-btn:hover{ background: rgba(255,255,255,.08); color: var(--parchment); }

  .catalog-tag{
    display:inline-flex;
    align-items:baseline;
    gap:10px;
    background: var(--parchment);
    color: var(--ink);
    padding: 6px 14px;
    border-radius: 3px;
    font-family:'JetBrains Mono', monospace;
    margin-bottom: 16px;
    box-shadow: 0 3px 0 rgba(0,0,0,.3);
    transform: rotate(-1deg);
  }
  .tag-month{ font-weight:600; font-size:13px; letter-spacing:.04em; text-transform:uppercase; }
  .tag-count{ font-size:11px; color:#5c4b30; }

  .photo-stage{
    display:flex; align-items:center; gap: 10px;
    min-height: 0;
  }
  .photo-frame{
    flex:1;
    min-width:0;
    min-height: 200px;
    max-height: 80vh;
    border-radius: 6px;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    box-shadow: inset 0 0 0 6px rgba(239,227,200,.9), 0 10px 24px rgba(0,0,0,.4);
  }
  .photo-frame .ph-icon{ font-size: 40px; opacity:.55; }
  .photo-frame img{
    display:block;
    width:auto; height:auto;
    max-width:100%; max-height:80vh;
    object-fit:contain;
  }
  .photo-frame .ph-label{
    position:absolute; bottom:10px; left:12px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    background: rgba(0,0,0,.35);
    padding: 3px 8px;
    border-radius: 3px;
    color: #fff;
  }

  .nav{
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    color: var(--parchment);
    width: 38px; height: 38px;
    border-radius: 50%;
    font-size: 18px;
    cursor:pointer;
    flex: 0 0 auto;
    transition: background .2s ease;
  }
  .nav:hover{ background: rgba(255,255,255,.16); }

  .dots{
    display:flex; justify-content:center; gap:6px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .dots span{
    width:6px;height:6px;border-radius:50%;
    background: rgba(239,227,200,.25);
    transition: background .2s ease, transform .2s ease;
  }
  .dots span.active{ background: var(--brass); transform: scale(1.3); }

  .hint{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: #6b5a3f;
    margin-top: 40px;
  }

  .close-hint{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #cbbfa2;
    margin: 0 0 14px;
    opacity: .8;
  }

  @keyframes fadeDown{ from{opacity:0; transform:translateY(-14px);} to{opacity:1; transform:none;} }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;} }

  @media (max-width: 560px){
    body{ padding: 32px 12px 72px; }
    .book{ width:34px; height:140px; }
  }
</style>
</head>
<body>

<div class="library">
  <div class="intro">
    <p class="eyebrow">Blaisdell Collection &middot; Est. 2026</p>
    <h1>The Archive</h1>
    <p class="subtitle" id="subtitle">Every year has a shelf. Every month has a book. Click a spine to open it.</p>
  </div>
  <main id="shelves"></main>
  <p class="hint">← → to flip pages &nbsp;&middot;&nbsp; Esc to close</p>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-card">
    <button class="close-btn" id="closeBtn">✕</button>
    <p class="close-hint">Click anywhere to close this book</p>
    <div class="catalog-tag">
      <span class="tag-month" id="tagMonth">Jan 2026</span>
      <span class="tag-count" id="tagCount">1 / 6</span>
    </div>
    <div class="photo-stage">
      <button class="nav" id="prevBtn">‹</button>
      <div class="photo-frame" id="photoFrame"></div>
      <button class="nav" id="nextBtn">›</button>
    </div>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script src="photos-data.js"></script>
<script>
  // Switch this to 'date' to restore the old year/month library (shelves =
  // years, books = the 12 months). buildDateShelves() below still implements
  // that mode in full — it's just unused while ORG_MODE is 'person'.
  const ORG_MODE = 'person';

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // PHOTOS comes from photos-data.js (generated by build-manifest.js).
  // In 'person' mode: PHOTOS = { PersonName: { BookLabel: [paths...] } }, key = {a: person, b: bookLabel}.
  // In 'date' mode:   PHOTOS = { "year-monthIdx": [paths...] },           key = {a: year, b: monthIdx}.
  function photosFor(key){
    if (typeof PHOTOS === 'undefined') return null;
    if (ORG_MODE === 'person') return (PHOTOS[key.a] && PHOTOS[key.a][key.b]) || null;
    return PHOTOS[`${key.a}-${key.b}`] || null;
  }

  // deterministic pseudo-random so the 'date' mode demo placeholder looks the same every load
  function seeded(n){
    const x = Math.sin(n * 999.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function hashStr(s){
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return h;
  }

  function photoCountFor(key){
    const real = photosFor(key);
    if (real) return real.length;
    return 4 + Math.floor(seeded(hashStr(`${key.a}-${key.b}`)) * 7); // 4-10 photos
  }

  function gradientFor(key, photoIdx){
    const seed = hashStr(`${key.a}-${key.b}-${photoIdx}`);
    const h1 = Math.floor(seeded(seed) * 360);
    const h2 = Math.floor(seeded(seed + 1) * 360);
    return `linear-gradient(135deg, hsl(${h1} 45% 42%), hsl(${h2} 55% 28%))`;
  }

  // Placeholder shelves shown only while photos/ has no real Person/Book
  // folders yet, so the layout can be previewed before you organize photos.
  // These names never match real PHOTOS entries, so photosFor() naturally
  // falls back to the gradient placeholders below — remove this once you
  // have real folders in place.
  const DEMO_PEOPLE = [
    { name: 'Grandpa/Carter Blaisdell & Grandma/Anita Blaisdell', books: ['Early Days', 'Friends', 'Pastor Years', 'First Family', 'Grandkids','Misc'] },
    { name: 'Grandpa/Carter Blaisdell & Kay Blaisdell', books: ['Marriage', 'Grandkids','Additional Family','Misc'] },
    { name: 'Gen X Collection', books: ['X Family Photos','David Blaisdell', 'Valerie Blaisdell','Sarah Blaisdell','John Blaisdell','Beloved Pets'] },
    { name: 'Gen Z/Kids Collection', books: ['Z Family Photos','Aaron', 'Steven','Matthew','Christopher','Rainy','Madeleine','Brandon','Ethan','Andrew'] }
  ];

  // Shelves = people, books = each person's photo subfolders (photos/<Person>/<Book>/).
  function buildPersonShelves(){
    const photos = (typeof PHOTOS !== 'undefined') ? PHOTOS : {};
    const people = Object.keys(photos).sort((a, b) => a.localeCompare(b));

    if (people.length === 0) {
      return DEMO_PEOPLE.map(person => ({
        title: person.name,
        note: `${person.books.length} book${person.books.length === 1 ? '' : 's'} on this shelf (placeholder)`,
        books: person.books.map((label, i) => {
          const key = { a: person.name, b: label };
          return {
            label,
            key,
            count: photoCountFor(key),
            colorVar: `--spine-${(i % 12) + 1}`
          };
        })
      }));
    }

    return people.map(person => {
      const bookNames = Object.keys(photos[person]).sort((a, b) => a.localeCompare(b));
      return {
        title: person,
        note: `${bookNames.length} book${bookNames.length === 1 ? '' : 's'} on this shelf`,
        books: bookNames.map((name, i) => ({
          label: name,
          key: { a: person, b: name },
          count: photos[person][name].length,
          colorVar: `--spine-${(i % 12) + 1}`
        }))
      };
    });
  }

  // Old layout: shelves = years, books = the 12 fixed months (placeholder
  // colors fill in months with no real folder). Kept for easy revert.
  function buildDateShelves(){
    const photoYears = (typeof PHOTOS !== 'undefined')
      ? Object.keys(PHOTOS).map(key => parseInt(key.split('-')[0], 10))
      : [];
    const YEARS = [...new Set([...photoYears, 2024, 2025, 2026])].sort();

    return YEARS.map(year => ({
      title: String(year),
      note: '12 books on this shelf',
      books: MONTHS.map((name, i) => {
        const key = { a: year, b: i };
        return {
          label: `${name} ${year}`,
          key,
          count: photoCountFor(key),
          colorVar: `--spine-${i + 1}`
        };
      })
    }));
  }

  document.getElementById('subtitle').textContent = ORG_MODE === 'person'
    ? 'Every person has a shelf. Every memory has a book. Click a spine to open it.'
    : 'Every year has a shelf. Every month has a book. Click a spine to open it.';

  const shelvesEl = document.getElementById('shelves');
  const shelves = ORG_MODE === 'person' ? buildPersonShelves() : buildDateShelves();

  const usingPlaceholders = ORG_MODE === 'person'
    && Object.keys((typeof PHOTOS !== 'undefined') ? PHOTOS : {}).length === 0;

  if (usingPlaceholders) {
    const note = document.createElement('p');
    note.style.cssText = "text-align:center;color:#8a7a5f;font-family:'JetBrains Mono',monospace;font-size:12px;margin:-30px 0 40px;";
    note.textContent = 'Showing placeholder shelves — add photos to photos/<Person>/<Book>/ and run build-manifest.js to replace them.';
    shelvesEl.parentNode.insertBefore(note, shelvesEl);
  }

  shelves.forEach((shelf, si) => {
    const block = document.createElement('div');
    block.className = 'shelf-block';
    block.style.animationDelay = (si * 0.12) + 's';

    const plate = document.createElement('div');
    plate.className = 'year-plate';
    plate.innerHTML = `<span class="brass-tab">${shelf.title}</span><span class="year-note">${shelf.note}</span>`;
    block.appendChild(plate);

    const row = document.createElement('div');
    row.className = 'books-row';

    shelf.books.forEach(book => {
      const el = document.createElement('div');
      el.className = 'book';
      el.style.background = `var(${book.colorVar})`;
      el.tabIndex = 0;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', `${book.label}, ${book.count} photos`);
      el.innerHTML = `<span class="spine-cap"></span><span class="spine-label">${book.label}</span>`;

      const open = () => openBook(book.key, book.count, book.label);
      el.addEventListener('click', open);
      el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });

      row.appendChild(el);
    });

    block.appendChild(row);

    const shelfBoard = document.createElement('div');
    shelfBoard.className = 'shelf-board';
    block.appendChild(shelfBoard);

    shelvesEl.appendChild(block);
  });

  // Lightbox logic
  const lightbox = document.getElementById('lightbox');
  const photoFrame = document.getElementById('photoFrame');
  const tagMonth = document.getElementById('tagMonth');
  const tagCount = document.getElementById('tagCount');
  const dotsEl = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const closeBtn = document.getElementById('closeBtn');

  let current = { key: null, count: 0, index: 0, label: '' };

  function openBook(key, count, label){
    current = { key, count, index: 0, label };
    tagMonth.textContent = label;
    renderDots();
    renderPhoto();
    lightbox.classList.add('open');
  }

  function renderDots(){
    dotsEl.innerHTML = '';
    for(let i=0; i<current.count; i++){
      const d = document.createElement('span');
      if(i === current.index) d.classList.add('active');
      dotsEl.appendChild(d);
    }
  }

  function renderPhoto(){
    const { key, index, count, label } = current;
    const real = photosFor(key);

    if (real) {
      photoFrame.style.background = 'none';
      photoFrame.innerHTML = `<img src="${real[index]}" alt="${label} photo ${index+1}">`;
    } else {
      photoFrame.style.background = gradientFor(key, index);
      photoFrame.innerHTML = `<span class="ph-icon">🖼</span><span class="ph-label">Photo ${index+1}</span>`;
    }

    tagCount.textContent = `${index+1} / ${count}`;
    [...dotsEl.children].forEach((d, i) => d.classList.toggle('active', i === index));
  }

  function step(delta){
    current.index = (current.index + delta + current.count) % current.count;
    renderPhoto();
  }

  function closeLightbox(){ lightbox.classList.remove('open'); }

  prevBtn.addEventListener('click', () => step(-1));
  nextBtn.addEventListener('click', () => step(1));
  closeBtn.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', e => { if(e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', e => {
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'ArrowLeft') step(-1);
    if(e.key === 'ArrowRight') step(1);
    if(e.key === 'Escape') closeLightbox();
  });
</script>

</body>
</html>
